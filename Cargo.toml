[package]
name = "rust_realease"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
toml = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
url = "2.5"
tempfile = "3"
regex = "1"
flate2 = "1.1"
sha2 = "0.10"
similar = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
